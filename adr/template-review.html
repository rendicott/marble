<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marble · ADR-NNNN Design Review</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel-2: #1e2330; --border: #2a3142;
      --text: #e8ecf4; --muted: #9aa3b5; --accent: #7c9cff; --accent-2: #5eead4;
      --warn: #fbbf24; --ok: #4ade80; --chip: #252b3a;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--sans); color: var(--text); line-height: 1.55;
      background: var(--bg);
    }
    header.top {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15,17,21,0.92); border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;
    }
    .brand { font-weight: 700; display: flex; gap: 0.6rem; align-items: center; }
    .status {
      font-size: 0.78rem; padding: 0.25rem 0.6rem; border-radius: 999px;
      background: #3a2e10; color: var(--warn); border: 1px solid #6b5420;
      font-family: var(--mono);
    }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    section {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 1.25rem 1.4rem; margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.35rem; }
    h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
    h3 { font-size: 0.92rem; margin: 1rem 0 0.4rem; color: var(--accent-2); }
    .muted { color: var(--muted); }
    .lede { color: var(--muted); max-width: 72ch; }
    .q {
      border: 1px solid var(--border); border-radius: 10px;
      padding: 0.6rem 0.8rem; margin: 0.4rem 0; background: #141824; font-size: 0.9rem;
    }
    .q strong { color: var(--warn); font-family: var(--mono); font-size: 0.78rem; }
    .q .rec { color: var(--muted); font-size: 0.84rem; margin-top: 0.2rem; }
    code { font-family: var(--mono); font-size: 0.86em; background: var(--chip);
      padding: 0.12rem 0.35rem; border-radius: 5px; border: 1px solid var(--border); }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 1rem 0 2rem; }
  </style>
  <link rel="stylesheet" href="review-kit.css" />
</head>
<body data-adr="NNNN" data-adr-title="Short title here">
  <header class="top">
    <div class="brand">
      <span>Marble · ADR-NNNN</span>
      <span class="status">PROPOSED · review</span>
    </div>
  </header>
  <main>
    <section>
      <h1>Title</h1>
      <p class="lede">One-paragraph goal.</p>
    </section>

    <section id="questions">
      <h2>Open questions</h2>

      <h3>Topic</h3>
      <div class="q" data-qid="Q1" data-status="open"
           data-rec="Plain-text recommendation the kit stores when Use rec is chosen">
        <strong>Q1</strong> Example question?
        <div class="rec">Rec: human-readable recommendation with optional <code>code</code>.</div>
      </div>
    </section>
  </main>
  <footer>Marble · ADR template · see README.md</footer>
  <script src="review-kit.js"></script>
</body>
</html>
