# Build and publish marble-harness binaries on version tags (v*).
# Builds run only on GitHub-hosted runners — do not upload local binaries.
name: Release

on:
  push:
    tags:
      - "v*"
  # Re-run a release build without retagging (uses the selected tag ref).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Resolve version tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "Tag must start with v (got: $TAG)" >&2
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ver.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          builds=(
            "linux amd64"
            "linux arm64"
            "darwin arm64"
          )

          for spec in "${builds[@]}"; do
            set -- $spec
            GOOS="$1"
            GOARCH="$2"
            out="dist/marble-harness-${GOOS}-${GOARCH}"
            echo "Building ${out}…"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" \
              -o "$out" ./cmd/marble-harness
            chmod +x "$out"
          done

          (
            cd dist
            sha256sum marble-harness-* > SHA256SUMS
          )
          ls -la dist
          cat dist/SHA256SUMS

      - name: Upload unsigned dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-unsigned
          path: dist/
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Marble ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/marble-harness-linux-amd64
            dist/marble-harness-linux-arm64
            dist/marble-harness-darwin-arm64
            dist/SHA256SUMS

  # Signs and notarizes the macOS binary, then publishes a stapled DMG.
  # Needs a real Developer ID Application identity. An ad-hoc signature gets a
  # new cdhash on every build, which resets macOS TCC grants (Downloads, etc.).
  # Skips cleanly when the secrets are absent, so a release still ships the
  # unsigned binaries. See README "Signed macOS DMG".
  macos-dmg:
    name: Sign, notarize & publish DMG
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: macos-14
    steps:
      - name: Require signing secrets
        id: gate
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in P12 PW ID ISSUER KEY_ID KEY; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "missing secret for $name" >&2
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not set; skipping the notarized DMG." >&2
            echo "Add them under Settings → Secrets → Actions. See README." >&2
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download unsigned dist
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist-unsigned
          path: dist

      - name: Import Developer ID certificate
        if: steps.gate.outputs.ready == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/marble-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # codesign on a runner finds the identity through the default keychain.
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign, notarize, staple DMG
        if: steps.gate.outputs.ready == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          chmod +x dist/marble-harness-darwin-arm64

          # Stable identifier. Ad-hoc signing derives one from the cdhash, which
          # changes every build and orphans TCC grants. A fixed identifier plus a
          # Developer ID keeps Files-and-Folders grants across upgrades.
          codesign --force --options runtime --timestamp \
            --identifier com.rendicott.marble-harness \
            --sign "$IDENTITY" \
            dist/marble-harness-darwin-arm64
          codesign --verify --verbose=2 dist/marble-harness-darwin-arm64
          codesign -dv dist/marble-harness-darwin-arm64 2>&1 | grep -E "Identifier|Authority"

          STAGE="$RUNNER_TEMP/dmg-root"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp dist/marble-harness-darwin-arm64 "$STAGE/marble-harness"
          chmod +x "$STAGE/marble-harness"

          DMG="dist/Marble-Harness-${TAG}-macOS-arm64.dmg"
          rm -f "$DMG"
          hdiutil create -volname "Marble Harness" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"

          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          codesign --verify --verbose=2 "$DMG"

          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          # --wait exits non-zero on Invalid, but the reason lives in the log.
          # Capture it before failing so a rejected submission is diagnosable.
          set +e
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER" \
            --wait --timeout 20m | tee "$RUNNER_TEMP/notary.txt"
          rc=${PIPESTATUS[0]}
          set -e
          sub="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/notary.txt" | head -1 || true)"
          if [ "$rc" != "0" ]; then
            echo "notarytool submit failed (rc=$rc); fetching log for ${sub:-unknown}" >&2
            if [ -n "$sub" ]; then
              xcrun notarytool log "$sub" \
                --key "$RUNNER_TEMP/AuthKey.p8" \
                --key-id "$KEY_ID" \
                --issuer "$ISSUER" || true
            fi
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            exit "$rc"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG" || true
          ls -la "$DMG"

      - name: Publish DMG to the release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/Marble-Harness-${TAG}-macOS-arm64.dmg" --clobber
          body: |
            Pre-built **marble-harness** binaries built on **GitHub Actions** (`CGO_ENABLED=0`).

            | Asset | Platform |
            |-------|----------|
            | `marble-harness-linux-amd64` | Linux x86_64 |
            | `marble-harness-linux-arm64` | Linux aarch64 |
            | `marble-harness-darwin-arm64` | macOS Apple Silicon |

            ```bash
            chmod +x marble-harness-linux-amd64
            ./marble-harness-linux-amd64 --version
            ./marble-harness-linux-amd64 -h
            ```

            Verify:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            See the [README](https://github.com/rendicott/marble#readme) for launch flags, systemd, API keys, and cron.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
