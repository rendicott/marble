# Build and publish marble-harness binaries on version tags (v*).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          # linux/amd64, linux/arm64, darwin/arm64
          builds=(
            "linux amd64"
            "linux arm64"
            "darwin arm64"
          )

          for spec in "${builds[@]}"; do
            set -- $spec
            GOOS="$1"
            GOARCH="$2"
            out="dist/marble-harness-${GOOS}-${GOARCH}"
            echo "Building ${out}…"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" \
              -o "$out" ./cmd/marble-harness
            chmod +x "$out"
          done

          # Checksums (binaries only)
          (
            cd dist
            sha256sum marble-harness-* > SHA256SUMS
          )
          ls -la dist
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Marble ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/marble-harness-linux-amd64
            dist/marble-harness-linux-arm64
            dist/marble-harness-darwin-arm64
            dist/SHA256SUMS
          body: |
            Pre-built **marble-harness** binaries (`CGO_ENABLED=0`).

            | Asset | Platform |
            |-------|----------|
            | `marble-harness-linux-amd64` | Linux x86_64 |
            | `marble-harness-linux-arm64` | Linux aarch64 |
            | `marble-harness-darwin-arm64` | macOS Apple Silicon |

            ```bash
            chmod +x marble-harness-linux-amd64
            ./marble-harness-linux-amd64 --version
            ./marble-harness-linux-amd64 -h
            ```

            Verify:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            See the [README](https://github.com/rendicott/marble#readme) for launch flags, systemd, API keys, and cron.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
